#macx-g++ (different from g++.conf)

#
# qmake configuration for macx-g++
#
# Mac OS X + command-line compiler
#

MAKEFILE_GENERATOR	= UNIX
TARGET_PLATFORM		= macx
TEMPLATE		= app
CONFIG			+= qt warn_on release app_bundle incremental global_init_link_order lib_version_first plugin_no_soname link_prl
QT			+= core gui
QMAKE_INCREMENTAL_STYLE = sublib

include(/opt/local/share/qt4/mkspecs/common/mac.conf)
include(/opt/local/share/qt4/mkspecs/common/gcc-base-macx.conf)
include(../common/g++-macx-jpanetta.conf)

QMAKE_CC         = gcc-mp-4.7
QMAKE_CXX        = g++-mp-4.7

QMAKE_LINK       = $$QMAKE_CXX
QMAKE_LINK_SHLIB = $$QMAKE_CXX
QMAKE_LINK_C       = $$QMAKE_CC
QMAKE_LINK_C_SHLIB = $$QMAKE_CC

load(qt_config)
