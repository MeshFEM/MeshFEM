dist: trusty
sudo: false
language: cpp
matrix:
  include:
    - os: linux
      compiler: gcc-7
      addons:
        sources:
          - ubuntu-toolchain-r-test
        packages:
          - g++-7
          - libboost-all-dev
          - libsuitesparse-dev
      script:
        - cmake -DCMAKE_BUILD_TYPE=Debug -DCMAKE_C_COMPILER=gcc-7 -DCMAKE_CXX_COMPILER=g++-7 ..
        - make -j2

    - os: osx
      compiler: clang
      script: cmake -DCMAKE_BUILD_TYPE=Debug .. && make -j2

before_install:
  - if [[ "$TRAVIS_OS_NAME" == "osx" ]]; then brew install suite-sparse; fi
before_script:
  - mkdir build
  - cd build
